name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check responsive images
        run: pip install -q pillow && python3 tools/test_portrait_orientation.py && python3 tools/images.py --check
      - name: Check font subsets
        run: pip install -q fonttools brotli && python3 tools/fonts.py --check
      - name: Check page metadata
        run: python3 tools/check_seo.py
      - name: Check structured data
        run: python3 tools/structured_data.py --check
      - name: Check concert end dates
        run: python3 tools/test_event_end_date.py
      - name: Check landing and artists acceptance
        run: |
          python3 tools/test_landing_artists.py
          python3 -m tools.test_announced_concert
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check theme and mobile navigation in Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          python3 -m http.server 4175 >/tmp/site-server.log 2>&1 &
          export PLAYWRIGHT_MODULE=playwright
          node tools/test_theme_controls.cjs
          node tools/test_mobile_header.cjs
          node tools/test_page_motion.cjs
      - name: Prepare public site
        run: |
          mkdir _site
          cp -- *.html *.png *.ico *.svg CNAME robots.txt sitemap.xml site.webmanifest .nojekyll _site/
          cp -R -- assets concerts en photo _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
