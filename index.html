<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>word&music — найближчий концерт</title>
    <meta name="description" content="Найближчий концерт word&music — «Vivre, Aimer, rêver…». Квитки та деталі на Eventmate.">
    <meta name="theme-color" content="#ffffff">
    <link rel="canonical" href="https://wordandmusic.art/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="uk_UA">
    <meta property="og:site_name" content="word&music">
    <meta property="og:title" content="word&music">
    <meta property="og:description" content="Музика і художнє слово">
    <meta property="og:url" content="https://wordandmusic.art/">
    <meta property="og:image" content="https://raw.githubusercontent.com/wordandmusicart/wordandmusicart.github.io/main/assets/word-and-music-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Логотип word&music білим на чорному тлі">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="preload" href="assets/FixelText-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page" aria-labelledby="concert-heading">
      <img
        class="brand reveal reveal--logo"
        src="assets/word-and-music-logo-black.svg"
        width="1648"
        height="266"
        alt="word&music"
      >

      <h1 class="eyebrow reveal reveal--heading" id="concert-heading">Наш найближчий концерт</h1>

      <a
        class="poster-link reveal reveal--poster"
        href="https://eventmate.app/events/share/koncert-ziti-kohati-mriati"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Відкрити сторінку концерту «Vivre, Aimer, rêver…» на Eventmate"
      >
        <picture>
          <source media="(max-width: 700px)" srcset="assets/concert-mobile.png">
          <img
            class="poster"
            src="assets/concert-desktop.png"
            width="1920"
            height="1080"
            alt="Афіша концерту «Vivre, Aimer, rêver…», 3 жовтня 2026 року о 16:00"
          >
        </picture>
      </a>
    </main>
  </body>
</html>
